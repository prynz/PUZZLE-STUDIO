# Real screenshots of the running preview build (Android emulator / iOS simulator).
# File names: shot-<PLATFORM>-NN-<screen>.png → committed as <prefix>-<PLATFORM>-NN-<screen>.png
appId: com.puzzlestudio.app.preview
---
- launchApp:
    clearState: true
- runFlow: dismiss-system-dialogs.yaml
# App-start preloader (stays at least 4.5 s) – optional so a slow cold start never breaks the flow
- extendedWaitUntil:
    visible: 'Wird geladen …'
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible: 'Wird geladen …'
    commands:
      - takeScreenshot: screenshots/shot-${PLATFORM}-00-startup
- extendedWaitUntil:
    visible: 'Hallo, ich bin Pino!'
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-01-onboarding-welcome
- tapOn:
    id: 'onb-next'
- extendedWaitUntil:
    visible: 'Erstellen, puzzeln, sammeln'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-02-onboarding-promise
- tapOn:
    id: 'onb-next'
- extendedWaitUntil:
    visible: 'Wer puzzelt?'
    timeout: 10000
- tapOn:
    id: 'profile-toddler'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-03-onboarding-profile
- tapOn:
    id: 'onb-finish'
- extendedWaitUntil:
    visible: 'Was puzzeln wir heute?'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-04-home
- tapOn:
    id: 'tab-create'
- extendedWaitUntil:
    visible: 'Puzzle-Atelier'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-05-atelier
- tapOn:
    id: 'src-samples'
- extendedWaitUntil:
    visible: 'Segelboot'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-06-samples
- tapOn:
    id: 'sample-sea-boat'
- extendedWaitUntil:
    visible: 'Bild zurechtrücken'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-07-crop
- tapOn:
    id: 'aspect-square'
- tapOn:
    id: 'crop-zoom-in'
- swipe:
    from:
      id: 'crop-frame'
    direction: LEFT
    duration: 600
- tapOn:
    id: 'crop-rotate'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-08-crop-square-rotated
- tapOn:
    id: 'crop-confirm'
# CI simulators render without GPU and vary a lot (iOS runner 2026-11-03: > 2 min) – real devices take about a second
- extendedWaitUntil:
    visible: 'Meine Bilder · 1'
    timeout: 240000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-09-atelier-image-saved
# Phase 5: start a puzzle from the saved picture and solve it with Pino's hints
- tapOn:
    id: 'my-image'
- extendedWaitUntil:
    visible: 'Wie viele Teile?'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-10-new-puzzle
- tapOn:
    id: 'pieces-4'
- tapOn:
    id: 'puzzle-start'
- extendedWaitUntil:
    visible:
      id: 'tray-slot-0'
    timeout: 30000
- extendedWaitUntil:
    notVisible: 'Pino legt die Teile bereit …'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/shot-${PLATFORM}-11-play
- tapOn:
    id: 'play-hint'
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: screenshots/shot-${PLATFORM}-12-hint
- tapOn:
    id: 'hint-target'
- tapOn:
    id: 'play-hint'
- tapOn:
    id: 'hint-target'
- tapOn:
    id: 'play-hint'
- tapOn:
    id: 'hint-target'
- tapOn:
    id: 'play-hint'
- tapOn:
    id: 'hint-target'
- extendedWaitUntil:
    visible: 'Geschafft!'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: screenshots/shot-${PLATFORM}-13-puzzle-done
- tapOn:
    id: 'done-atelier'
- extendedWaitUntil:
    visible: 'Meine Bilder · 1'
    timeout: 15000
# Phase 6: the finished puzzle appears in the collection, the milestone in the awards
- tapOn:
    id: 'tab-collection'
- extendedWaitUntil:
    visible:
      id: 'collection-card'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-14-collection
- tapOn:
    id: 'tab-awards'
- extendedWaitUntil:
    visible:
      id: 'awards-stars'
    timeout: 10000
- assertVisible:
    id: 'ach-first_puzzle'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-15-awards
- tapOn:
    id: 'tab-home'
- tapOn:
    id: 'open-parents'
# Phase 7: parent gate (number words) → parents' area with three areas
- extendedWaitUntil:
    visible:
      id: 'gate-task'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-16-parent-gate
- runFlow: parent-gate.yaml
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-17-parents-play
- tapOn:
    id: 'parents-data'
# counts sit at the top; "Alles löschen" may be below the fold on small screens
- extendedWaitUntil:
    visible:
      id: 'data-images'
      text: '1'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-18-parents-data
- tapOn:
    id: 'parents-info'
- extendedWaitUntil:
    visible:
      id: 'parents-privacy'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-19-parents-info
- scrollUntilVisible:
    element:
      id: 'parents-system-check'
    direction: DOWN
- tapOn:
    id: 'parents-system-check'
- extendedWaitUntil:
    visible: 'Datenbank \(SQLite\)'
    timeout: 15000
# privacy: iOS excludes the data folder from iCloud/computer backups, Android has allowBackup=false
- scrollUntilVisible:
    element:
      id: 'check-backup'
    direction: DOWN
- extendedWaitUntil:
    visible: '.*(von der iCloud-/Computer-Sicherung ausgeschlossen|Google-Sicherung für diese App ausgeschaltet).*'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-20-system-check
# 256-piece test – now built from the real puzzle engine (Phase 4)
- scrollUntilVisible:
    element:
      id: 'check-back'
    direction: DOWN
- tapOn:
    id: 'check-back'
- scrollUntilVisible:
    element:
      id: 'parents-benchmark'
    direction: DOWN
- tapOn:
    id: 'parents-benchmark'
- extendedWaitUntil:
    visible: 'Treffer µs'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Lädt …'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/shot-${PLATFORM}-21-benchmark-256
# Persistence: relaunch WITHOUT clearing state → onboarding skipped, profile and image kept
- stopApp
- launchApp:
    clearState: false
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: 'Was puzzeln wir heute?'
    timeout: 60000
- tapOn:
    id: 'open-parents'
- runFlow: parent-gate.yaml
- assertVisible:
    id: 'parents-profile-toddler'
    selected: true
- takeScreenshot: screenshots/shot-${PLATFORM}-22-after-relaunch-profile-kept
- tapOn:
    id: 'parents-back'
- tapOn:
    id: 'tab-create'
- extendedWaitUntil:
    visible: 'Meine Bilder · 1'
    timeout: 15000
- assertVisible:
    id: 'my-image'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-23-after-relaunch-image-kept
