# Real screenshots of the running preview build (Android emulator / iOS simulator).
# File names: shot-<PLATFORM>-NN-<screen>.png → committed as <prefix>-<PLATFORM>-NN-<screen>.png
appId: com.puzzlestudio.app.preview
---
- launchApp:
    clearState: true
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: 'Hallo, ich bin Pino!'
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-01-onboarding-welcome
- tapOn:
    id: 'onb-next'
- extendedWaitUntil:
    visible: 'Erstellen, puzzeln, sammeln'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-02-onboarding-promise
- tapOn:
    id: 'onb-next'
- extendedWaitUntil:
    visible: 'Wer puzzelt?'
    timeout: 10000
- tapOn:
    id: 'profile-toddler'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-03-onboarding-profile
- tapOn:
    id: 'onb-finish'
- extendedWaitUntil:
    visible: 'Was puzzeln wir heute?'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-04-home
- tapOn:
    id: 'tab-create'
- extendedWaitUntil:
    visible: 'Puzzle-Atelier'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-05-atelier
- tapOn:
    id: 'src-samples'
- extendedWaitUntil:
    visible: 'Segelboot'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-06-samples
- tapOn:
    id: 'sample-sea-boat'
- extendedWaitUntil:
    visible: 'Bild zurechtrücken'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-07-crop
- tapOn:
    id: 'aspect-square'
- tapOn:
    id: 'crop-zoom-in'
- swipe:
    from:
      id: 'crop-frame'
    direction: LEFT
    duration: 600
- tapOn:
    id: 'crop-rotate'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-08-crop-square-rotated
- tapOn:
    id: 'crop-confirm'
- extendedWaitUntil:
    visible: 'Meine Bilder · 1'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-09-atelier-image-saved
- tapOn:
    id: 'tab-home'
- tapOn:
    id: 'open-parents'
- extendedWaitUntil:
    visible: 'Spielhilfe-Profil'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-10-parents
- scrollUntilVisible:
    element:
      id: 'parents-system-check'
    direction: DOWN
- tapOn:
    id: 'parents-system-check'
- extendedWaitUntil:
    visible: 'Datenbank \(SQLite\)'
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-11-system-check
# 256-piece test – now built from the real puzzle engine (Phase 4)
- scrollUntilVisible:
    element:
      id: 'check-back'
    direction: DOWN
- tapOn:
    id: 'check-back'
- scrollUntilVisible:
    element:
      id: 'parents-benchmark'
    direction: DOWN
- tapOn:
    id: 'parents-benchmark'
- extendedWaitUntil:
    visible: 'Treffer µs'
    timeout: 15000
- extendedWaitUntil:
    notVisible: 'Lädt …'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/shot-${PLATFORM}-12-benchmark-256
# Persistence: relaunch WITHOUT clearing state → onboarding skipped, profile and image kept
- stopApp
- launchApp:
    clearState: false
- runFlow: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: 'Was puzzeln wir heute?'
    timeout: 60000
- tapOn:
    id: 'open-parents'
- extendedWaitUntil:
    visible: 'Spielhilfe-Profil'
    timeout: 10000
- assertVisible:
    id: 'parents-profile-toddler'
    selected: true
- takeScreenshot: screenshots/shot-${PLATFORM}-13-after-relaunch-profile-kept
- tapOn: 'Zurück'
- tapOn:
    id: 'tab-create'
- extendedWaitUntil:
    visible: 'Meine Bilder · 1'
    timeout: 15000
- assertVisible:
    id: 'my-image'
- waitForAnimationToEnd
- takeScreenshot: screenshots/shot-${PLATFORM}-14-after-relaunch-image-kept
